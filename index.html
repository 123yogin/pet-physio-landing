<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Per-route <title>, description, canonical, Open Graph, Twitter and JSON-LD are
      injected at build time by scripts/prerender.mjs (from src/seo/head.ts) and kept
      in sync on client navigation by the same generator. The title below is only a
      fallback for the dev server, where prerendering does not run.
    -->
    <title>The Pet Physio Vet</title>

    <meta name="format-detection" content="telephone=no" />
    <meta name="theme-color" content="#fef9f2" />

    <!--
      Icons. These files existed in public/ but nothing ever linked to them, so
      the browser tab fell back to a blank default.

      Same mark, and the same wiring, as the clinic app (frontend/index.html):
      an SVG icon the browser scales to any density, and a 1024px PNG for the
      iOS home screen. Keeping the two products on one icon means a user who
      has both open sees one brand, not two.

      favicon-32.png and apple-touch-icon.png are deliberately NOT linked: they
      still hold the older paw mark, and a fallback that shows a different logo
      is worse than no fallback.

      The ?v= is not decoration. Vite fingerprints what it bundles, but files in
      public/ are copied verbatim, so the icon URL never changes when the art
      does -- and a browser caches a favicon far more stubbornly than a page.
      This origin kept serving the previous paw from cache after the file itself
      had been replaced. Bump the number whenever the mark changes.
    -->
    <link rel="icon" type="image/svg+xml" href="/logo.svg?v=2" />
    <link rel="apple-touch-icon" href="/logo.png?v=2" />

    <!--
      Fonts: preconnect saves a round trip on the render-blocking stylesheet, and
      display=swap keeps text painting immediately instead of blocking LCP on the
      font file. Both stylesheets are Google Fonts, the one external host allowed here.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />

  </head>
  <body
    class="bg-[#fef9f2] text-[#3C2117] antialiased selection:bg-[#3c2117] selection:text-white min-h-screen flex flex-col font-['Inter']"
  >
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
